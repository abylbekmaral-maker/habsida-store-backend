services:
  postgres-db:
    image: postgres:17-alpine
    container_name: spring_boot_postgres_dev
    environment:
      POSTGRES_DB: habsida_backend
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: