spring:
  application:
    name: auth-service
  profiles:
    active: dev

  app:
    jwt:
      secret: ${JWT_SECRET:default_long_secret_key_if_not_set_in_env_32}
      expiration: 86400000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
server:
  port: 8080